services:
  caddy:
    image: caddy:2.8-alpine
    container_name: caddy
    profiles:
      - proxy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - PUBLIC_APP_HOST=${PUBLIC_APP_HOST:-localhost}
      - PUBLIC_AUTH_HOST=${PUBLIC_AUTH_HOST:-auth.localhost}
      - PUBLIC_S3_HOST=${PUBLIC_S3_HOST:-s3.localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    depends_on:
      - lobe-chat
      - casdoor
      - minio
    restart: unless-stopped

  casdoor:
    image: casbin/casdoor:v2.13.0
    container_name: casdoor
    ports:
      - "127.0.0.1:${CASDOOR_PORT:-47002}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - RUNNING_IN_DOCKER=true
      - driverName=postgres
      - dataSourceName=user=postgres password=${POSTGRES_PASSWORD:-postgres} host=postgres port=5432 sslmode=disable dbname=casdoor
    volumes:
      - ./config/init_data.json:/init_data.json:ro
      - ./config/casdoor-app.conf:/conf/app.conf:ro
    command: /bin/sh -c './server --createDatabase=true'
    restart: unless-stopped

  lobe-chat:
    image: lobehub/lobe-chat-database
    container_name: lobe-chat
    ports:
      - "127.0.0.1:${LOBECHAT_PORT:-47000}:3210"
    volumes:
      # HOTFIX: Patch MCP callTool to add session retry logic
      - ./patches/route.js:/app/.next/server/app/(backend)/trpc/tools/[trpc]/route.js:ro
    environment:
      # App configuration
      - APP_URL=${PUBLIC_APP_URL:-http://${HOST_DOMAIN:-localhost}:${LOBECHAT_PORT:-47000}}
      # Database configuration
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/lobechat
      # NextAuth SSO configuration
      - NEXT_AUTH_SSO_PROVIDERS=casdoor
      - NEXT_AUTH_SECRET=${NEXT_AUTH_SECRET}
      - NEXTAUTH_URL=${PUBLIC_APP_URL:-http://${HOST_DOMAIN:-localhost}:${LOBECHAT_PORT:-47000}}
      - AUTH_URL=${PUBLIC_APP_URL:-http://${HOST_DOMAIN:-localhost}:${LOBECHAT_PORT:-47000}}
      # Casdoor configuration
      - AUTH_CASDOOR_ISSUER=${PUBLIC_AUTH_URL:-http://${HOST_DOMAIN:-localhost}:${CASDOOR_PORT:-47002}}
      - AUTH_CASDOOR_ID=${AUTH_CASDOOR_ID}
      - AUTH_CASDOOR_SECRET=${AUTH_CASDOOR_SECRET}
      # Trust custom hostname for NextAuth
      - AUTH_TRUST_HOST=true
      # S3 Storage configuration
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_BUCKET=${S3_BUCKET:-lobe}
      - S3_PUBLIC_DOMAIN=${PUBLIC_S3_URL:-http://${HOST_DOMAIN:-localhost}:${MINIO_PORT:-47005}}
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_ENABLE_PATH_STYLE=1
      - S3_SET_ACL=0
      # Key Vaults Secret
      - KEY_VAULTS_SECRET=${KEY_VAULTS_SECRET}
      # OpenRouter integration
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ENABLED_OPENROUTER=1
      - DEFAULT_AGENT_CONFIG=model=gpt-4.1-mini;provider=openai
      # Direct OpenAI provider, also used for embeddings
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Embedding model configuration
      - DEFAULT_FILES_CONFIG=embedding_model=openai/text-embedding-3-small
      - LLM_VISION_IMAGE_USE_BASE64=1
      # Suppress changelog modal + update-check redirect on every page load
      - FEATURE_FLAGS=-changelog,-check_updates
      # Allow server-side MCP calls to the private Docker network.
      - SSRF_ALLOW_PRIVATE_IP_ADDRESS=1
      - MCP_TOOL_TIMEOUT=120000
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      casdoor:
        condition: service_started
      minio:
        condition: service_healthy
      mcphub:
        condition: service_started

  mcphub:
    build:
      context: .
      dockerfile: dockerfiles/mcphub.Dockerfile
    image: lobechat-aws-mcphub:latest
    container_name: mcphub
    ports:
      - "127.0.0.1:${MCPHUB_PORT:-47008}:3000"
    environment:
      - DOCKER_API_VERSION=1.44
      - SSH_HOST=${SSH_HOST}
      - SSH_PORT=${SSH_PORT:-22}
      - SSH_USERNAME=${SSH_USERNAME}
      - SSH_PRIVATE_KEY_FILE=/app/ssh/id_rsa
      - SSH_ALLOWED_COMMANDS=${SSH_ALLOWED_COMMANDS}
      - SSH_ALLOWED_PATHS=${SSH_ALLOWED_PATHS}
      - SSH_COMMANDS_BLACKLIST=${SSH_COMMANDS_BLACKLIST}
      - SSH_ARGUMENTS_BLACKLIST=${SSH_ARGUMENTS_BLACKLIST}
      # AWS region config (credentials read from mounted ~/.aws)
      - AWS_REGION=${AWS_REGION:-eu-west-1}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-eu-west-1}
      # Notion MCP integration token (Bearer header)
      - OPENAPI_MCP_HEADERS=${OPENAPI_MCP_HEADERS}
      # Runtime MinIO credentials for the MinIO MCP server
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./config/mcp_settings.json:/app/mcp_settings.json
      - ./data/mcphub:/app/data
      - ./config/ssh:/app/ssh:ro
      # AWS credentials - mounted so boto3 reads fresh creds without container restart
      - ~/.aws:/root/.aws:ro
      # Docker socket for MCP servers that use docker (aws-resources-operations)
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      qdrant:
        condition: service_healthy
      hayhooks-mcp:
        condition: service_started
      linux-sandbox:
        condition: service_started
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "127.0.0.1:${QDRANT_PORT:-47010}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-47011}:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  hayhooks:
    image: deepset/hayhooks:v1.1.0
    container_name: hayhooks
    ports:
      - "127.0.0.1:${HAYHOOKS_PORT:-47012}:1416"
    environment:
      - HAYHOOKS_HOST=0.0.0.0
      - HAYHOOKS_PORT=1416
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  hayhooks-mcp:
    image: deepset/hayhooks:v1.1.0
    container_name: hayhooks-mcp
    ports:
      - "127.0.0.1:${HAYHOOKS_MCP_PORT:-47013}:1417"
    environment:
      - QDRANT_URL=http://qdrant:6333
    entrypoint: ["sh","-c"]
    command: ["pip install --no-cache-dir 'hayhooks[mcp]==1.1.0' && exec hayhooks mcp run --host 0.0.0.0 --port 1417 --json-response"]
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:gemma4
    container_name: vllm
    profiles:
      - gpu
    ports:
      - "127.0.0.1:${VLLM_PORT:-47007}:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      - ./data/huggingface:/root/.cache/huggingface
    command: >
      --model ${VLLM_MODEL_ID:-google/gemma-4-E4B-it}
      --trust-remote-code
      --max-model-len 32768
      --dtype bfloat16
      --gpu-memory-utilization 0.9
      --enable-auto-tool-choice
      --tool-call-parser gemma4
      --reasoning-parser gemma4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "127.0.0.1:${MINIO_PORT:-47005}:9000"      # S3 API
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-47006}:9001"      # MinIO Console
    volumes:
      - ./data/minio:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_API_CORS_ALLOW_ORIGIN=${PUBLIC_APP_URL:-http://${HOST_DOMAIN:-localhost}:${LOBECHAT_PORT:-47000}}
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5


  linux-sandbox:
    build:
      context: .
      dockerfile: dockerfiles/sandbox.Dockerfile
    image: lobechat-aws-linux-sandbox:latest
    container_name: linux-sandbox
    volumes:
      - /home/oriol/.ssh:/home/oriol/.ssh
    restart: unless-stopped
    # Idle container; commands are exec'd in via the linux-sandbox MCP server
    command: ["tail", "-f", "/dev/null"]

  postgres:
    image: pgvector/pgvector:pg16
    container_name: shared-postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-47003}:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_INITDB_ARGS=-E UTF8 --locale=C
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./config/init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    shm_size: 128mb

# All data is stored in host folders under ./data/
# No Docker volumes needed
